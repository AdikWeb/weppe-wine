name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*-macos']
    paths:
      - .github/workflows/macos.yml
      - common.sh
      - macos/**
      - patches/**
      - tests/**
      - tools/**

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Reuse a build of the same sources
        id: cached-build
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dist
          key: macos-build-${{ hashFiles('common.sh', 'macos/versions.sh', 'macos/build-wine.sh', 'macos/build-dxmt.sh', 'macos/package.sh', 'patches/**') }}

      - name: Install build tools
        if: steps.cached-build.outputs.cache-hit != 'true'
        run: |
          brew install --quiet bison flex autoconf meson ninja
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Build Wine
        if: steps.cached-build.outputs.cache-hit != 'true'
        run: macos/build-wine.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/bundle/Wine Staging.app"

      - name: Build DXMT
        if: steps.cached-build.outputs.cache-hit != 'true'
        run: macos/build-dxmt.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/work/wine-build" "$RUNNER_TEMP/bundle/Wine Staging.app"

      - name: Package
        if: steps.cached-build.outputs.cache-hit != 'true'
        run: macos/package.sh "$RUNNER_TEMP/bundle/Wine Staging.app" "$RUNNER_TEMP/dist"

      - name: Build the test programs
        run: macos/build-tests.sh "$RUNNER_TEMP/work" "$RUNNER_TEMP/tests"

      - uses: actions/upload-artifact@v7
        with:
          name: weppe-wine-macos
          path: ${{ runner.temp }}/dist
          compression-level: 0

      - uses: actions/upload-artifact@v7
        with:
          name: weppe-wine-tests
          path: ${{ runner.temp }}/tests

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/work/*.log
          if-no-files-found: ignore

  test:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: winemenubuilder.exe=d
      PANEL_PIXELS_REQUIRED: 30000
      WINDOW_PIXELS_REQUIRED: 20000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: weppe-wine-macos
          path: ${{ runner.temp }}/dist

      - uses: actions/download-artifact@v8
        with:
          name: weppe-wine-tests
          path: ${{ runner.temp }}/tests

      - name: Unpack the build
        run: |
          macos/unpack-build.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/runner"
          echo "WINE=$RUNNER_TEMP/runner/Contents/Resources/wine/bin/wine" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$RUNNER_TEMP/prefix" >> "$GITHUB_ENV"

      - name: Create a prefix
        run: |
          "$WINE" --version
          "$WINE" wineboot -u
          "$(dirname "$WINE")/wineserver" -w

      - name: Call InitPropVariantFromFileTime from 32-bit and 64-bit programs
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          for target in i686 x86_64; do
            "$WINE" "$RUNNER_TEMP/tests/propvariant-filetime-$target.exe" | tee "$RUNNER_TEMP/results/propvariant-$target.log"
            grep -q 'propvariant filetime: ok' "$RUNNER_TEMP/results/propvariant-$target.log"
          done

      - name: Ask for the Cloud Files platform version from 32-bit and 64-bit programs, as DingTalk does
        run: |
          for target in i686 x86_64; do
            "$WINE" "$RUNNER_TEMP/tests/cloud-files-platform-info-$target.exe" | tee "$RUNNER_TEMP/results/cloud-files-$target.log"
            grep -q 'cloud files platform info: ok' "$RUNNER_TEMP/results/cloud-files-$target.log"
          done

      - name: Look up a child window behind another one's window region, as Qt 5 does for the mouse wheel
        run: |
          for target in i686 x86_64; do
            "$WINE" "$RUNNER_TEMP/tests/child-window-from-point-region-$target.exe" | tee "$RUNNER_TEMP/results/child-window-from-point-$target.log"
            grep -q 'child window from point region: ok' "$RUNNER_TEMP/results/child-window-from-point-$target.log"
          done

      - name: Draw a triangle with Direct3D 11
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          "$WINE" "$RUNNER_TEMP/tests/d3d11-triangle.exe" 2>&1 | tee "$RUNNER_TEMP/results/d3d11-triangle.log"
          grep -q 'd3d11 triangle: ok' "$RUNNER_TEMP/results/d3d11-triangle.log"

      - name: Share a texture between two devices, as Chromium's GPU process does
        continue-on-error: true
        run: |
          "$WINE" "$RUNNER_TEMP/tests/d3d11-shared-texture.exe" 2>&1 | tee "$RUNNER_TEMP/results/d3d11-shared-texture.log"
          grep -q 'd3d11 shared texture: ok' "$RUNNER_TEMP/results/d3d11-shared-texture.log"

      - name: Present from another process into a child window
        run: |
          swiftc -O tools/count-colors.swift -o "$RUNNER_TEMP/count-colors"
          "$WINE" "$RUNNER_TEMP/tests/d3d11-present.exe" > "$RUNNER_TEMP/results/d3d11-present.log" 2>&1 &
          test_pid=$!
          sleep 15
          screencapture -x "$RUNNER_TEMP/results/d3d11-present.png"
          wait "$test_pid" || echo "the present test exited with $?"
          cat "$RUNNER_TEMP/results/d3d11-present.log"
          "$RUNNER_TEMP/count-colors" "$RUNNER_TEMP/results/d3d11-present.png" 00ffff ffff00 ff00ff | tee "$RUNNER_TEMP/results/colors.txt"
          pixels() { awk -v color="$1" '$1 == color { print $2 }' "$RUNNER_TEMP/results/colors.txt"; }
          failed=0
          test "$(pixels 00ffff)" -ge "$WINDOW_PIXELS_REQUIRED" || { echo "the owner's own window is not drawn"; failed=1; }
          test "$(pixels ffff00)" -ge "$PANEL_PIXELS_REQUIRED" || { echo "the owner's child window is not drawn"; failed=1; }
          test "$(pixels ff00ff)" -ge "$PANEL_PIXELS_REQUIRED" || { echo "the child window drawn by another process is not drawn"; failed=1; }
          test "$failed" = 0
          grep -q 'remote process exit code: 0' "$RUNNER_TEMP/results/d3d11-present.log"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  steam:
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      WINEDEBUG: fixme-all
      WINEDLLOVERRIDES: winemenubuilder.exe=d
      DXMT_LOG_LEVEL: debug
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: weppe-wine-macos
          path: ${{ runner.temp }}/dist

      - name: Unpack the build
        run: |
          macos/unpack-build.sh "$RUNNER_TEMP/dist" "$RUNNER_TEMP/runner"
          echo "WINE=$RUNNER_TEMP/runner/Contents/Resources/wine/bin/wine" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$RUNNER_TEMP/prefix" >> "$GITHUB_ENV"

      - name: Create a prefix
        run: |
          "$WINE" wineboot -u
          "$(dirname "$WINE")/wineserver" -w

      - name: Draw Steam's sign-in window
        run: macos/test-steam.sh "$RUNNER_TEMP/results"

      - name: Collect Steam's logs
        if: ${{ !cancelled() }}
        run: cp -R "$WINEPREFIX/drive_c/Program Files (x86)/Steam/logs" "$RUNNER_TEMP/results/steam-logs" || true

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: steam-results
          path: |
            ${{ runner.temp }}/results
            !${{ runner.temp }}/results/SteamSetup.exe
            !${{ runner.temp }}/results/window-shot
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: weppe-wine-macos
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xJOf dist/*.tar.xz --wildcards '*/Contents/Resources/weppe-wine/build.txt' > notes.txt
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.txt
